name: 'push-bareos-app'
description: 'Push Bareos docker images to Docker Hub'
author: 'dark-vex'
inputs:
  docker_pass:
    description: 'Registry Password'
    required: true
  docker_user:
    description: 'Registry Username'
    required: true
  image_prefix:
    description: >-
      Full image name prefix (overrides registry/GITHUB_REPOSITORY).
      E.g. harbor.example.com/project/bareos
    required: false
  registry:
    description: 'Registry URL'
    required: false
  dockerhub_user:
    description: >-
      Docker Hub username. When set together with dockerhub_pass, images are
      additionally pushed to Docker Hub alongside the primary registry.
    required: false
  dockerhub_pass:
    description: 'Docker Hub password/token'
    required: false
  dockerhub_image_prefix:
    description: 'Docker Hub image name prefix'
    required: false
    default: 'darkvex/bareos'
  wiz_client_id:
    description: 'Wiz service account client ID'
    required: true
  wiz_client_secret:
    description: 'Wiz service account client secret'
    required: true
outputs:
  pushed_digests_file:
    description: >-
      Workspace-relative path to a text file listing "<image>@sha256:..."
      for every tag or manifest digest actually pushed to a registry this
      run (images blocked by the Wiz scan gate are excluded). The file is
      always created, empty when nothing was pushed.
runs:
  using: 'docker'
  image: 'Dockerfile'
