name: 'push-bareos-app'
description: 'Push Bareos docker images to Docker Hub'
author: 'Barcus'
inputs:
  docker_pass:
    description: 'Registry Password'
    required: true
  docker_user:
   description: 'Registry Username'
   required: true
  image_prefix:
    description: 'Full image name prefix (overrides registry/GITHUB_REPOSITORY). E.g. harbor.example.com/project/bareos'
    required: false
  registry:
   description: 'Registry URL'
   required: false
runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.docker_user }}
    - ${{ inputs.docker_pass }}
    - ${{ inputs.registry }}
