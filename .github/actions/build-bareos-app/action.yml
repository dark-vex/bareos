name: 'build-bareos-app'
description: 'Build Bareos app images'
author: 'dark-vex'
inputs:
  registry:
    description: 'Registry URL'
    required: true
  build_file:
    description: 'Build-list filename within the build directory'
    required: false
    default: 'app_build.txt'
runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.registry }}
