# Set update schedule for GitHub Actions

version: 2

registries:
  dockerhub-mirror:
    type: docker-registry
    url: https://mirror.gcr.io
    replaces-base: true

updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every weekday
      interval: "daily"

  - package-ecosystem: "docker"
    directories:
      - "/director-pgsql/2[3-5]-*"
      - "/storage/2[3-5]-*"
      - "/client/2[3-5]-*"
      - "/webui/2[3-5]-*"
      - "/api/2[3-5]-alpine"
      - "/.github/actions/*"
      - "/bareos-packages"
      - "/bareos-alpine-packages"
    registries:
      - "dockerhub-mirror"
    schedule:
      interval: "daily"
    groups:
      alpine:
        patterns:
          - "alpine"
      ubuntu:
        patterns:
          - "ubuntu"
      python:
        patterns:
          - "python"
      docker-cli:
        patterns:
          - "docker"
    ignore:
      - dependency-name: "alpine"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "ubuntu"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "docker"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "pip"
    directories:
      - "/api/23-alpine"
      - "/api/24-alpine"
      - "/api/25-alpine"
    schedule:
      interval: "weekly"
    groups:
      bareos-python-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "bareos-restapi"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "python-bareos"
        update-types:
          - "version-update:semver-major"
      # pydantic-core is a transitive pin pydantic controls exactly
      # (pydantic==2.13.5 requires pydantic-core==2.46.5). Dependabot bumps
      # this pin on its own, independent of pydantic, which breaks pip's
      # resolver every time pydantic-core ships ahead of pydantic (see
      # PR #109, closed as unresolvable). Remove this once a published
      # pydantic release depends on pydantic-core>2.46.5.
      - dependency-name: "pydantic-core"
        versions:
          - "> 2.46.5"
