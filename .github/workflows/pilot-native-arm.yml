# Temporary workflow_dispatch-only pilot. Delete after native ARM CI is proven.
name: pilot-native-arm

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare build files
        uses: ./.github/actions/prepare-bareos-app
        with:
          bareos_app: director-pgsql

      - name: Fix build directory ownership
        # prepare-bareos-app runs as root inside a container, so build/ and
        # its contents come out root-owned; reclaim them for the runner user
        # before a plain (non-container) step tries to write new files there.
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" build

      - name: Limit pilot to Bareos 23 Alpine
        shell: bash
        run: |
          awk '$2 == "23-alpine-pgsql"' build/app_build.txt \
            > build/app_build-pilot.txt
          mv build/app_build-pilot.txt build/app_build.txt
          awk '$2 == "23-alpine-pgsql"' build/tag_build.txt \
            > build/tag_build-pilot.txt
          mv build/tag_build-pilot.txt build/tag_build.txt
          for arch in amd64 arm64 armv7; do
            awk -v arch="${arch}" '$3 == arch' build/app_build.txt \
              > "build/app_build-${arch}.txt"
          done

      - name: Upload build metadata
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact-director-tmp
          path: build

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: armv7
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build metadata
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-director-tmp
          path: build

      - name: Set up QEMU for armv7
        if: matrix.arch == 'armv7'
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: arm

      - name: Build images
        uses: ./.github/actions/build-bareos-app
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          build_file: app_build-${{ matrix.arch }}.txt

      - name: Load and test images
        uses: ./.github/actions/test-bareos-app
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          build_file: app_build-${{ matrix.arch }}.txt

      - name: Upload architecture tar files
        uses: actions/upload-artifact@v7
        with:
          name: bareos-director-tars-${{ matrix.arch }}
          path: build/*.tar
          if-no-files-found: error

  deploy:
    permissions:
      contents: read
      security-events: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build metadata
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-director-tmp
          path: build

      - name: Download all architecture tar files
        uses: actions/download-artifact@v4
        with:
          pattern: bareos-director-tars-*
          merge-multiple: true
          path: build

      - name: Verify all expected tar files
        shell: bash
        run: |
          has_error=0
          while read -r app version arch _; do
            tag="${version}"
            if [[ "${version}" =~ ^[0-9]+-alpine.*$ ]]; then
              tag="${version}-${arch}"
            fi
            filename="bareos-${app}-${tag}.tar"
            count=$(
              find build -maxdepth 1 -type f -name "${filename}" |
                wc -l
            )
            if [[ "${count}" -ne 1 ]]; then
              echo "::error::Expected exactly one build/${filename};" \
                "found ${count}"
              has_error=1
            fi
          done < build/app_build.txt
          exit "${has_error}"

      - name: Load and push pilot images
        uses: ./.github/actions/push-bareos-app
        with:
          docker_pass: ${{ secrets.DOCKER_PASS }}
          docker_user: ${{ secrets.DOCKER_USER }}
          registry: ${{ secrets.REGISTRY_URL }}
          image_prefix: >-
            ${{ secrets.REGISTRY_URL }}/pilot-${{ github.repository }}
          wiz_client_id: ${{ secrets.WIZ_CLIENT_ID }}
          wiz_client_secret: ${{ secrets.WIZ_CLIENT_SECRET }}

      - name: Check for SARIF results
        id: sarif_check
        if: success() || failure()
        run: |
          if compgen -G "build/sarif/*.sarif" > /dev/null; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF results
        if: >-
          (success() || failure()) &&
          steps.sarif_check.outputs.has_files == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/sarif
