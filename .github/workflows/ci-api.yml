name: ci-api

on:
  push:
    paths:
      - 'api*/**'
      - '.github/workflows/ci-api.yml'
      - '.github/actions/prepare-bareos-app/*'
      - '.github/actions/build-bareos-app/*'
      - '.github/actions/push-bareos-app/*'
      - '.github/actions/test-bareos-app/*'
  pull_request:
    paths:
      - 'api*/**'
      - '.github/workflows/ci-api.yml'
      - '.github/actions/prepare-bareos-app/*'
      - '.github/actions/build-bareos-app/*'
      - '.github/actions/push-bareos-app/*'
      - '.github/actions/test-bareos-app/*'
  workflow_dispatch:
  schedule:
    - cron: '35 5 * * *'

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare build file
        uses: ./.github/actions/prepare-bareos-app
        with:
          bareos_app: api

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact-api-tmp
          path: build

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact-api-tmp
          path: build

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Build images
        uses: ./.github/actions/build-bareos-app
        with:
          registry: ${{ secrets.REGISTRY_URL }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact-api
          path: build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact-api
          path: build

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Load and test images
        uses: ./.github/actions/test-bareos-app
        with:
          registry: ${{ secrets.REGISTRY_URL }}

  deploy:
    needs: test
    if: |
      (github.event_name == 'push' || github.event_name == 'schedule') &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact-api
          path: build

      - name: Load and push images
        uses: ./.github/actions/push-bareos-app
        with:
          docker_pass: ${{ secrets.DOCKER_PASS }}
          docker_user: ${{ secrets.DOCKER_USER }}
          registry: ${{ secrets.REGISTRY_URL }}
