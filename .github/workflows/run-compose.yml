name: run-compose

on:
  push:
    paths:
      - 'docker-compose*'
      - '.env.dist'
      - '.github/workflows/run-compose.yml'
  pull_request:
    paths:
      - 'docker-compose*'
      - '.env.dist'
      - '.github/workflows/run-compose.yml'
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 0'

permissions:
  contents: read

jobs:
  test-compose:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [ubuntu-pgsql, alpine-pgsql]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create required folder
        run: |
          sudo mkdir -p /data/bareos/config/director/bareos-dir.d/profile
          sudo mkdir -p /data/bareos/data/director
          sudo mkdir -p /data/bareos/config/storage
          sudo mkdir -p /data/bareos/data/storage
          sudo mkdir -p /data/bareos/config/client
          sudo mkdir -p /data/bareos/config/webui
          sudo mkdir -p /data/bareos/data/webui
          sudo mkdir -p /data/mysql/data
          sudo mkdir -p /data/pgsql/data
          sudo chmod 777 /data/bareos /data/mysql /data/pgsql
          # webui-admin.conf's path moved (webui/install/bareos/... -> core/src/defaultconfigs/...)
          # and gained a "Plugin Options ACL" directive between Bareos 21 and 25, so each leg
          # fetches the profile matching the Bareos major it actually runs.
          if [ "${{ matrix.module }}" == "alpine-pgsql" ]; then
            profile_url="https://raw.githubusercontent.com/bareos/bareos/Release/25.0.3/core/src/defaultconfigs/bareos-dir.d/profile/webui-admin.conf"
          else
            profile_url="https://raw.githubusercontent.com/bareos/bareos/Release/21.1.11/webui/install/bareos/bareos-dir.d/profile/webui-admin.conf"
          fi
          sudo curl -s "$profile_url" \
            -o /data/bareos/config/director/bareos-dir.d/profile/webui-admin.conf

      - name: Run docker-compose
        run: |
          set -euo pipefail
          cp .env.dist .env
          chmod 600 .env
          for name in DB_PASSWORD DB_ADMIN_PASSWORD BAREOS_SD_PASSWORD BAREOS_FD_PASSWORD BAREOS_WEBUI_PASSWORD; do
            password=$(openssl rand -hex 32)
            printf '::add-mask::%s\n' "$password"
            sed -i "s#^${name}=.*#${name}=${password}#" .env
          done
          sed -i 's#DB_INIT=false#DB_INIT=true#' docker-compose-${{ matrix.module }}.yml
          docker compose -f docker-compose-${{ matrix.module }}.yml up -d --wait --wait-timeout 180

      - name: Run Bareos console
        run: |
          docker exec bareos-bareos-dir-1 bconsole

      - name: Dump compose state on failure
        if: failure()
        run: |
          docker compose -f docker-compose-${{ matrix.module }}.yml ps
          for c in $(docker compose -f docker-compose-${{ matrix.module }}.yml ps -q); do
            echo "=== $(docker inspect --format='{{.Name}}' "$c") health ==="
            docker inspect --format='{{json .State.Health}}' "$c" || true
            echo "=== $(docker inspect --format='{{.Name}}' "$c") logs (last 100) ==="
            docker logs --tail 100 "$c" || true
          done
