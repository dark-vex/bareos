name: pilot-registry-cache

# Benchmark only: compares the current no-cache build against a
# registry-backed buildx cache (cold vs. warm) for one representative
# target (client/24-ubuntu). Not a gate — workflow_dispatch only, never
# runs on push/PR/schedule. Reuses the existing REGISTRY_URL/DOCKER_USER/
# DOCKER_PASS secrets already used by push-bareos-app; no new secrets
# needed. Everything here is pushed only to a clearly-scoped
# "-cache-test" ref, never to a real release tag.
#
# All three jobs use identical --build-arg values (fixed literals, not
# git rev-parse/date) and no --output/--load, so the only variable
# between them is cache behavior — a changing BUILD_DATE or VCS_REF would
# invalidate every layer below the LABEL that consumes it and make
# cache-warm look as slow as cache-cold.
on:
  workflow_dispatch:

env:
  PILOT_VCS_REF: pilot-test
  PILOT_BUILD_DATE: '2026-01-01T00:00:00Z'

jobs:
  cache-baseline:
    name: cache-baseline (--no-cache)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create buildx builder
        run: docker buildx create --use

      - name: Build client/24-ubuntu with --no-cache
        working-directory: client/24-ubuntu
        run: |
          start=$(date +%s)
          docker buildx build \
            --no-cache \
            --build-arg VERSION=24 \
            --build-arg VCS_REF="${PILOT_VCS_REF}" \
            --build-arg BUILD_DATE="${PILOT_BUILD_DATE}" \
            --build-arg NAME="${GITHUB_REPOSITORY}-client" \
            --tag bareos-client:pilot-cache-baseline \
            .
          end=$(date +%s)
          echo "BUILD_SECONDS=$((end - start))" >> "$GITHUB_ENV"

      - name: Write timing summary
        run: |
          {
            echo "### cache-baseline (--no-cache)"
            echo ""
            echo "| run | seconds |"
            echo "|---|---|"
            echo "| no-cache | ${BUILD_SECONDS} |"
          } >> "$GITHUB_STEP_SUMMARY"

  cache-cold:
    name: cache-cold (registry cache, first run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create buildx builder
        run: docker buildx create --use

      - name: Log in to registry
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
        run: |
          registry="${REGISTRY_URL#https://}"
          registry="${registry#http://}"
          registry="${registry%/}"
          echo "REGISTRY=${registry}" >> "$GITHUB_ENV"
          docker login "${registry}" -u "${DOCKER_USER}" -p "${DOCKER_PASS}"

      - name: Build client/24-ubuntu with empty registry cache
        working-directory: client/24-ubuntu
        run: |
          cache_ref="${REGISTRY}/${GITHUB_REPOSITORY}-cache-test:client-24-ubuntu"
          start=$(date +%s)
          docker buildx build \
            --build-arg VERSION=24 \
            --build-arg VCS_REF="${PILOT_VCS_REF}" \
            --build-arg BUILD_DATE="${PILOT_BUILD_DATE}" \
            --build-arg NAME="${GITHUB_REPOSITORY}-client" \
            --cache-to "type=registry,ref=${cache_ref},mode=max" \
            --cache-from "type=registry,ref=${cache_ref}" \
            --tag bareos-client:pilot-cache-cold \
            .
          end=$(date +%s)
          echo "BUILD_SECONDS=$((end - start))" >> "$GITHUB_ENV"

      - name: Write timing summary
        run: |
          {
            echo "### cache-cold (registry cache, first run)"
            echo ""
            echo "| run | seconds |"
            echo "|---|---|"
            echo "| cache-cold | ${BUILD_SECONDS} |"
          } >> "$GITHUB_STEP_SUMMARY"

  cache-warm:
    name: cache-warm (registry cache, second run)
    needs: cache-cold
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create buildx builder
        run: docker buildx create --use

      - name: Log in to registry
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
        run: |
          registry="${REGISTRY_URL#https://}"
          registry="${registry#http://}"
          registry="${registry%/}"
          echo "REGISTRY=${registry}" >> "$GITHUB_ENV"
          docker login "${registry}" -u "${DOCKER_USER}" -p "${DOCKER_PASS}"

      - name: Build client/24-ubuntu against the now-populated registry cache
        working-directory: client/24-ubuntu
        run: |
          cache_ref="${REGISTRY}/${GITHUB_REPOSITORY}-cache-test:client-24-ubuntu"
          start=$(date +%s)
          docker buildx build \
            --build-arg VERSION=24 \
            --build-arg VCS_REF="${PILOT_VCS_REF}" \
            --build-arg BUILD_DATE="${PILOT_BUILD_DATE}" \
            --build-arg NAME="${GITHUB_REPOSITORY}-client" \
            --cache-to "type=registry,ref=${cache_ref},mode=max" \
            --cache-from "type=registry,ref=${cache_ref}" \
            --tag bareos-client:pilot-cache-warm \
            .
          end=$(date +%s)
          echo "BUILD_SECONDS=$((end - start))" >> "$GITHUB_ENV"

      - name: Write timing summary
        run: |
          {
            echo "### cache-warm (registry cache, second run)"
            echo ""
            echo "| run | seconds |"
            echo "|---|---|"
            echo "| cache-warm | ${BUILD_SECONDS} |"
            echo ""
            echo "Compare cache-cold vs. cache-warm above for the real signal."
          } >> "$GITHUB_STEP_SUMMARY"
