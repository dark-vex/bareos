name: ci-storage

on:
  push:
    paths:
      - 'storage*/**'
      - '.github/workflows/ci-storage.yml'
      - '.github/actions/prepare-bareos-app/*'
      - '.github/actions/build-bareos-app/*'
      - '.github/actions/push-bareos-app/*'
      - '.github/actions/test-bareos-app/*'
  pull_request:
    paths:
      - 'storage*/**'
      - '.github/workflows/ci-storage.yml'
      - '.github/actions/prepare-bareos-app/*'
      - '.github/actions/build-bareos-app/*'
      - '.github/actions/push-bareos-app/*'
      - '.github/actions/test-bareos-app/*'
  workflow_dispatch:
  schedule:
    - cron: '35 5 * * 0'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare build file
        uses: ./.github/actions/prepare-bareos-app
        with:
          bareos_app: storage

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifact-storage-tmp
          path: build

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: armv7
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifact-storage-tmp
          path: build

      - name: Set up QEMU for armv7
        if: matrix.arch == 'armv7'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm

      - name: Build images
        uses: ./.github/actions/build-bareos-app
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          build_file: app_build-${{ matrix.arch }}.txt

      - name: Load and test images
        uses: ./.github/actions/test-bareos-app
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          build_file: app_build-${{ matrix.arch }}.txt

      - name: Upload architecture tar files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bareos-storage-tars-${{ matrix.arch }}
          path: build/*.tar
          if-no-files-found: error

  deploy:
    permissions:
      contents: read
      security-events: write
      id-token: write
    needs: build
    if: |
      (github.event_name == 'push' || github.event_name == 'schedule') &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifact-storage-tmp
          path: build

      - name: Download all architecture tar files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bareos-storage-tars-*
          merge-multiple: true
          path: build

      - name: Verify all expected tar files
        shell: bash
        run: |
          has_error=0
          while read -r app version arch _; do
            tag="${version}"
            if [[ "${version}" =~ ^[0-9]+-alpine.*$ ]]; then
              tag="${version}-${arch}"
            fi
            filename="bareos-${app}-${tag}.tar"
            count=$(
              find build -maxdepth 1 -type f -name "${filename}" |
                wc -l
            )
            if [[ "${count}" -ne 1 ]]; then
              echo "::error::Expected exactly one build/${filename};" \
                "found ${count}"
              has_error=1
            fi
          done < build/app_build.txt
          exit "${has_error}"

      - name: Load and push images
        uses: ./.github/actions/push-bareos-app
        with:
          docker_pass: ${{ secrets.DOCKER_PASS }}
          docker_user: ${{ secrets.DOCKER_USER }}
          registry: ${{ secrets.REGISTRY_URL }}
          dockerhub_user: ${{ secrets.DOCKERHUB_USER }}
          dockerhub_pass: ${{ secrets.DOCKERHUB_PASS }}
          wiz_client_id: ${{ secrets.WIZ_CLIENT_ID }}
          wiz_client_secret: ${{ secrets.WIZ_CLIENT_SECRET }}

      - name: Install cosign
        if: success() || failure()
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: 'v2.6.5'

      - name: Install syft
        if: success() || failure()
        env:
          SYFT_VERSION: '1.52.0'
          SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
        run: |
          curl -sSLo syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
          sudo tar -xzf syft.tar.gz -C /usr/local/bin syft
          rm -f syft.tar.gz

      - name: Log in to primary registry for signing
        if: success() || failure()
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Log in to Docker Hub for signing
        if: success() || failure()
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Sign images and attach SBOM and provenance attestations
        if: success() || failure()
        shell: bash
        run: |
          digest_file="build/pushed_digests.txt"
          if [[ ! -s "${digest_file}" ]]; then
            echo "No pushed image digests recorded; nothing to sign."
            exit 0
          fi
          predicate_dir=$(mktemp -d)
          while IFS= read -r ref; do
            [[ -z "${ref}" ]] && continue
            echo "::group::Signing and attesting ${ref}"
            cosign sign --yes "${ref}"

            sbom_file="${predicate_dir}/sbom.spdx.json"
            syft scan "registry:${ref}" -o "spdx-json=${sbom_file}"
            cosign attest --yes --type spdxjson --predicate "${sbom_file}" "${ref}"

            provenance_file="${predicate_dir}/provenance.json"
            cat > "${provenance_file}" <<PROVENANCE
          {
            "builder": { "id": "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" },
            "buildType": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/actions/push-bareos-app@v1",
            "invocation": {
              "configSource": {
                "uri": "git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}",
                "digest": { "sha1": "${GITHUB_SHA}" },
                "entryPoint": "${GITHUB_WORKFLOW_REF}"
              }
            },
            "metadata": {
              "buildInvocationId": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
              "completeness": { "parameters": false, "environment": false, "materials": false },
              "reproducible": false
            }
          }
          PROVENANCE
            cosign attest --yes --type slsaprovenance --predicate "${provenance_file}" "${ref}"
            echo "::endgroup::"
          done < "${digest_file}"

      - name: Check for SARIF results
        id: sarif_check
        if: success() || failure()
        run: |
          if compgen -G "build/sarif/*.sarif" > /dev/null; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF results
        if: >-
          (success() || failure()) &&
          steps.sarif_check.outputs.has_files == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: build/sarif
