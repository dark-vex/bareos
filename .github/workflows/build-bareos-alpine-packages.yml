name: build-bareos-alpine-packages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'
  push:
    branches:
      - master
    tags:
      - 'pkg/bareos-alpine-packages-*'
    paths:
      - 'bareos-alpine-packages/**'
      - '.github/workflows/build-bareos-alpine-packages.yml'

permissions:
  contents: read

jobs:
  build:
    # Native aarch64 runner — no QEMU emulation needed. A pilot benchmark
    # (pilot-alpine-packages-build-strategies.yml) measured this exact
    # abuild compile at ~57 minutes under QEMU on ubuntu-latest vs. ~3.5
    # minutes native here (~16.5x), matching bareos-alpine-packages/
    # README.md's own estimate ("about a minute" native vs. "several
    # minutes to ~1 hour" emulated).
    runs-on: ubuntu-24.04-arm
    environment: production
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - alpine_branch: 3.21-stable
            bareos_version: 23
          - alpine_branch: 3.23-stable
            bareos_version: 24
          - alpine_branch: 3.24-stable
            bareos_version: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build bareos-${{ matrix.bareos_version }} (alpine ${{ matrix.alpine_branch }}) aarch64 packages
        env:
          ALPINE_BRANCH: ${{ matrix.alpine_branch }}
          BAREOS_VERSION: ${{ matrix.bareos_version }}
          ABUILD_PRIVKEY: ${{ secrets.ABUILD_PRIVKEY }}
        run: |
          alpine_tag="${ALPINE_BRANCH%-stable}"
          docker build \
            -f "bareos-alpine-packages/Dockerfile.builder.${alpine_tag}" \
            -t "bareos-alpine-builder:${alpine_tag}" \
            bareos-alpine-packages/
          mkdir -p artifacts
          docker run --rm \
            -v "${{ github.workspace }}/artifacts:/artifacts" \
            -e "ALPINE_BRANCH=${ALPINE_BRANCH}" \
            -e "BAREOS_VERSION=${BAREOS_VERSION}" \
            -e ABUILD_PRIVKEY \
            "bareos-alpine-builder:${alpine_tag}"

      - name: List produced packages
        env:
          ALPINE_BRANCH: ${{ matrix.alpine_branch }}
          BAREOS_VERSION: ${{ matrix.bareos_version }}
        run: |
          alpine_tag="${ALPINE_BRANCH%-stable}"
          ls -lh "artifacts/bareos-${BAREOS_VERSION}-alpine${alpine_tag}/aarch64/"

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apks-bareos-${{ matrix.bareos_version }}-alpine-aarch64
          path: artifacts/bareos-${{ matrix.bareos_version }}-alpine*/aarch64/
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/pkg/bareos-alpine-packages-')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: apks-bareos-*-alpine-aarch64
          path: apks/

      - name: Create release tarballs
        run: |
          for dir in apks/apks-bareos-*-alpine-aarch64/bareos-*-alpine*; do
            name="$(basename "${dir}")"
            mkdir -p "flat/${name}"
            find "${dir}" -name '*.apk' -exec cp {} "flat/${name}/" \;
            tar czf "${name}-aarch64.tar.gz" -C "flat/${name}/" .
          done
          ls -l bareos-*-alpine*-aarch64.tar.gz
          tarballs=(bareos-*-alpine*-aarch64.tar.gz)
          test "${#tarballs[@]}" -eq 3
          sha256sum bareos-*-alpine*-aarch64.tar.gz

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: bareos-*-alpine*-aarch64.tar.gz
          fail_on_unmatched_files: true
