name: build-bareos-alpine-packages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'
  push:
    paths:
      - 'bareos-alpine-packages/**'
      - '.github/workflows/build-bareos-alpine-packages.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - alpine_branch: 3.21-stable
            bareos_version: 23
          - alpine_branch: 3.23-stable
            bareos_version: 24
          - alpine_branch: 3.24-stable
            bareos_version: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (aarch64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build bareos-${{ matrix.bareos_version }} (alpine ${{ matrix.alpine_branch }}) aarch64 packages
        env:
          ALPINE_BRANCH: ${{ matrix.alpine_branch }}
          BAREOS_VERSION: ${{ matrix.bareos_version }}
        run: |
          alpine_tag="${ALPINE_BRANCH%-stable}"
          docker build \
            --platform linux/arm64 \
            -f bareos-alpine-packages/Dockerfile.builder.${alpine_tag} \
            -t bareos-alpine-builder:${alpine_tag} \
            bareos-alpine-packages/
          mkdir -p artifacts
          docker run --rm \
            --platform linux/arm64 \
            -v "${{ github.workspace }}/artifacts:/artifacts" \
            -e ALPINE_BRANCH=${ALPINE_BRANCH} \
            -e BAREOS_VERSION=${BAREOS_VERSION} \
            bareos-alpine-builder:${alpine_tag}

      - name: List produced packages
        env:
          ALPINE_BRANCH: ${{ matrix.alpine_branch }}
          BAREOS_VERSION: ${{ matrix.bareos_version }}
        run: |
          alpine_tag="${ALPINE_BRANCH%-stable}"
          ls -lh "artifacts/bareos-${BAREOS_VERSION}-alpine${alpine_tag}/aarch64/"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: apks-bareos-${{ matrix.bareos_version }}-alpine-aarch64
          path: artifacts/bareos-${{ matrix.bareos_version }}-alpine*/aarch64/
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/pkg/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - alpine_branch: 3.21-stable
            bareos_version: 23
          - alpine_branch: 3.23-stable
            bareos_version: 24
          - alpine_branch: 3.24-stable
            bareos_version: 25

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: apks-bareos-${{ matrix.bareos_version }}-alpine-aarch64
          path: apks/

      - name: Create release tarball
        env:
          ALPINE_BRANCH: ${{ matrix.alpine_branch }}
          BAREOS_VERSION: ${{ matrix.bareos_version }}
        run: |
          alpine_tag="${ALPINE_BRANCH%-stable}"
          tar czf "bareos-${BAREOS_VERSION}-alpine${alpine_tag}-aarch64.tar.gz" \
            -C apks/ .

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: bareos-*-alpine*-aarch64.tar.gz
