## docker-compose Bareos Director/Storage/Client/webUI and PostgreSQL Database based on Ubuntu
services:
  bareos-dir:
    image: darkvex/bareos-director:25-ubuntu-pgsql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN   # entrypoint chown fixups before the daemon's own setuid drop
      - SETUID  # bareos-dir -u bareos internal privilege drop
      - SETGID
      # the ubuntu .deb package's config dirs/files are group-restricted with
      # the setgid bit set (e.g. drwxr-s--- bareos:bareos); on first run the
      # entrypoint's `tar --same-owner --preserve-permissions` (GNU tar's
      # default as root) chowns each entry to bareos:bareos, then chmods it
      # back to that setgid mode -- but by then the caller (root, group 0,
      # not a member of the bareos group) needs CAP_FSETID to preserve
      # setgid, or tar reports "Cannot change mode ...: Operation not
      # permitted" and aborts extraction. Alpine's package ships plain
      # (non-setgid) modes, so this is ubuntu-only.
      - FSETID
    read_only: true
    tmpfs:
      - /run/bareos
      # NOTE: unlike its alpine counterpart, the ubuntu entrypoint's permission
      # fixup only chowns /var/lib/bareos, not /var/log/bareos (the image
      # normally ships that dir pre-owned by bareos:bareos, which a bare tmpfs
      # mount here would otherwise silently replace with root:root and break
      # the daemon's own logging). mode=1777 works around that without an
      # entrypoint edit; fixing the ubuntu entrypoint to match alpine's chown
      # list is a good follow-up.
      - /var/log/bareos:mode=1777
      - /tmp # DB_INIT's make_bareos_tables writes a scratch .sql file here
    volumes:
      - /data/bareos/config/director:/etc/bareos
      - /data/bareos/data/director:/var/lib/bareos # required for MyCatalog backup
    environment:
      - DB_INIT=true #should be 'true' if bareos db does not exist
      - DB_UPDATE=false
      - DB_HOST=bareos-db
      - DB_PORT=5432
      - DB_NAME=bareos
      - DB_USER=bareos
      - DB_PASSWORD=${DB_PASSWORD} # defined in .env file
      - DB_ADMIN_USER=${DB_ADMIN_USER} # defined in .env file
      - DB_ADMIN_PASSWORD=${DB_ADMIN_PASSWORD} # defined in .env file
      - BAREOS_SD_HOST=bareos-sd
      - BAREOS_SD_PASSWORD=${BAREOS_SD_PASSWORD} # defined in .env file
      - BAREOS_FD_HOST=bareos-fd
      - BAREOS_FD_PASSWORD=${BAREOS_FD_PASSWORD} # defined in .env file
      - BAREOS_WEBUI_PASSWORD=${BAREOS_WEBUI_PASSWORD} # defined in .env file
      - SMTP_HOST=smtpd:8025 # Local smtp container
      #- SENDER_MAIL=your-sender@mail.address #optional
      - ADMIN_MAIL=your@mail.address # Change me!
      # Optional you can gets backup notification via Slack or Telegram
      - WEBHOOK_NOTIFICATION=false # true or false if set to true email notification gets disabled
      - WEBHOOK_TYPE=slack # choose slack or telegram
      - WEBHOOK_URL= # set the slack or telegram URL
      - WEBHOOK_CHAT_ID= # for telegram only set the <chat_id>
    depends_on:
      bareos-db:
        condition: service_healthy

  bareos-sd:
    image: darkvex/bareos-storage:25-ubuntu
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # entrypoint's `find ... -exec chown` walk over /var/lib/bareos and
      # /etc/bareos/bareos-sd.d is conditional (`! -user bareos`) and those
      # paths are already baked bareos-owned, so it's a no-op on the parent
      # dirs themselves in the default setup -- but it still chowns newly
      # written archive files/dirs under the bind-mounted /var/lib/bareos/storage,
      # and /dev/nst*/tape device nodes when a real tape device is attached.
      - CHOWN
      - SETUID  # bareos-sd -u bareos internal privilege drop
      - SETGID
      # ubuntu's setgid config dirs need this for first-run tar extraction to
      # succeed -- see the identical comment on bareos-dir's cap_add above.
      - FSETID
    read_only: true
    tmpfs:
      - /run/bareos
      # unlike the other daemons' entrypoints, sd's never chowns /var/log/bareos
      # (no default Messages resource writes there, so this was never exercised
      # until now); mode=1777 keeps it safe if an operator adds file logging --
      # see the Container Hardening section in the README for the mechanism.
      - /var/log/bareos:mode=1777
      # NOT chowned by the entrypoint (its conditional chown never touches
      # this path, since it's already baked bareos-owned) -- needed anyway
      # because the sd daemon itself writes a bootstrap file directly at
      # /var/lib/bareos/bareos-sd.<job>.bootstrap during restores (a sibling
      # of /var/lib/bareos/storage, not inside it). Missing this breaks
      # restores with "Could not create bootstrap file ... Read-only file
      # system" even though backups succeed -- only surfaced by actually
      # running a restore, not a backup.
      - /var/lib/bareos
    ports:
      - 9103:9103
    volumes:
      - /data/bareos/config/storage:/etc/bareos
      - /data/bareos/data/storage:/var/lib/bareos/storage
    environment:
      - BAREOS_SD_PASSWORD=${BAREOS_SD_PASSWORD} # defined in .env file

  bareos-fd:
    image: darkvex/bareos-client:25-ubuntu
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN   # entrypoint chown fixups (/etc/bareos, /run/bareos, /var/log/bareos, /var/lib/bareos)
      - SETUID  # su-exec drop to BAREOS_DAEMON_USER
      - SETGID
      # ubuntu's setgid config dirs need this for first-run tar extraction to
      # succeed -- see the identical comment on bareos-dir's cap_add above.
      - FSETID
    read_only: true
    tmpfs:
      - /run/bareos
      - /var/log/bareos
      - /var/lib/bareos # not bind-mounted (only /var/lib/bareos-director is); entrypoint chowns it directly
      - /tmp # bundled RestoreFiles job's default `Where` target (/tmp/bareos-restores);
             # confirmed by actually running a restore, not inferred
    volumes:
      - /data/bareos/config/client:/etc/bareos
      - /data/bareos/data/director:/var/lib/bareos-director # required for MyCatalog backup
    environment:
      - BAREOS_FD_PASSWORD=${BAREOS_FD_PASSWORD} # defined in .env file
      - FORCE_ROOT=false
      #- PUID=1500 # force bareos user ID -- NOTE: incompatible with read_only above (usermod
      #  writes /etc/passwd, which is on the read-only root fs); drop read_only if you enable this
      #- PGID=1500 # force bareos group ID

  # bareos-webui: both Apache (User/Group www-data via envvars) and php-fpm
  # (user/group www-data in www.conf, started by the entrypoint itself) already
  # self-drop worker processes. read_only:true is NOT applied: the entrypoint
  # unconditionally rewrites /etc/apache2/sites-available/000-default.conf (not
  # a bind mount) on every start, which a read-only root fs would block.
  bareos-webui:
    image: darkvex/bareos-webui:25-ubuntu
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID           # apache2/php-fpm masters (root) drop workers to www-data
      - SETGID
      - CHOWN            # php-fpm master chowns its unix socket to www-data
      - DAC_OVERRIDE     # /run/php is baked as www-data:www-data 0755; root needs this to
                         # write the fpm socket into it (root is "other" there, not owner)
      - NET_BIND_SERVICE # Apache listens on port 80
    ports:
      - 127.0.0.1:8080:80
    environment:
      - BAREOS_DIR_HOST=bareos-dir
      - SERVER_STATS=yes
    volumes:
      - /data/bareos/config/webui:/etc/bareos-webui

  bareos-db:
    image: postgres:12@sha256:2f2a8c2a7d10862e7fba2602e304523554f9df8244c632dafe2628ccb398fb5c
    volumes:
      - /data/pgsql/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_ADMIN_USER} # defined in .env file
      - POSTGRES_PASSWORD=${DB_ADMIN_PASSWORD} # defined in .env file
      - POSTGRES_INITDB_ARGS=--encoding=SQL_ASCII
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  smtpd:
    image: devture/exim-relay:4.98-r0-4@sha256:7ba30080c7a6ac4e93a99143ebd1aa229a16c47b97b2129002dc753c8a47f095

  # Optional tools
  # Bareos API
  # read_only is NOT applied: pip installs into /home/bareos at build time and
  # the entrypoint rewrites /home/bareos/api.ini on every start -- a tmpfs
  # there to allow that write shadows the whole image-baked install.
  bareos-api:
    image: darkvex/bareos-api:25-alpine
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL # already runs as USER 1000 from PID 1 -- no setuid/chown phase, no caps needed
    ports:
      - 127.0.0.1:8000:8000
    environment:
      - BAREOS_DIR_HOST=bareos-dir

  # Bareos metrics exporter for Prometheus
  bareos-exporter:
    image: vierbergenlars/bareos_exporter:v0.6.0@sha256:a950f10aa04f8d16ba50a0a64ffafdc13b52df687d90bafa1619ee8c3f93515e
    ports:
      - 127.0.0.1:9625:9625
    environment:
      - DB_HOST=bareos-db
      - DB_USER=bareos
      - DB_PASSWORD=${DB_PASSWORD}
      - WAIT_FOR_DB=15
    depends_on:
      bareos-db:
        condition: service_healthy

#EOF
