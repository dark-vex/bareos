# Build matrix: (bareos_branch, bareos_ref, ubuntu_codename) tuples
#
# bareos_branch is the artifact bucket.
# bareos_ref is the stable upstream Release tag to build from.
#
# bareos-23 / Release/23.1.7 / jammy   — Bareos 23.x on Ubuntu 22.04 (upstream apt has none)
# bareos-24 / Release/24.0.10 / noble  — Bareos 24.x on Ubuntu 24.04 (upstream only has 25.x)
#
# Bareos 25 is served by download.bareos.org/current/ and does not need
# a source build. bareos-20 and bareos-21 have upstream versioned repos.
# bareos-22 is deprecated by this fork (see CLAUDE.md's Version Support
# section) and no longer built here.
#
# Alpine is not listed here — no upstream APKBUILD exists; deferred.

matrix:
  - bareos_branch: bareos-23
    bareos_ref: Release/23.1.7
    ubuntu_codename: jammy
  - bareos_branch: bareos-24
    bareos_ref: Release/24.0.10
    ubuntu_codename: noble
